# Every project command runs through these services; nothing runs on the host.
# Services use Docker's default bridge (network_mode: bridge) so the project
# needs no network of its own.
services:
  dev:
    build:
      context: docker
      dockerfile: dev.Dockerfile
    working_dir: /repo
    network_mode: bridge
    volumes:
      - .:/repo
    mem_limit: 2g
    cpus: 4
