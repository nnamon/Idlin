name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: every commit in the pull request is dated in UTC
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          commits=$(git rev-list "$BASE..$HEAD")
          for c in $commits; do
            if [ "$(git log -1 --format='%ad %cd' --date=format:%z "$c")" != "+0000 +0000" ]; then
              echo "$(git rev-parse --short "$c") not dated in UTC"
              bad=1
            fi
          done
          exit "$bad"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
