name: capture

# Takes the watch-review captures of whatever is on main and keeps them for two
# weeks, and runs the long test sweeps at full size. Nothing requires this to
# pass; a failure here is filed as a bug.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @idlin/client build
      - run: node tools/capture/src/index.ts captures/review --review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures-${{ github.sha }}
          path: captures/review
          retention-days: 14

  # The gate runs a sample of each long sweep (many seeds, a whole game day);
  # this runs them at full size.
  long-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          IDLIN_LONG: "1"
