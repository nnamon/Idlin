name: Wiki

# Regenerate the content wiki from the RONs and publish it to the repo's
# Wiki tab on every RELEASE — the wiki documents shipped versions, not
# every push. The wiki inherits the repo's (private) visibility, unlike
# Pages.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Generate pages from the RONs
        run: cargo run -p idlin-content --bin wiki
      - name: Sync to the repo wiki
        run: |
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" wiki
          rm -f wiki/*.md
          cp docs/wiki/*.md wiki/
          # Wiki pages are flat names without extensions: fix inter-page
          # links and make the index the Home page.
          cd wiki
          sed -i 's/\(](\)\([a-z-]*\)\.md)/\1\2)/g' *.md
          mv README.md Home.md
          # Stamp which release these pages document.
          sed -i "1s/$/\n\n_Release: ${{ github.event.release.tag_name || 'manual run' }} (${GITHUB_SHA::8})_/" Home.md
          git config user.name "wiki-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && { echo "wiki unchanged"; exit 0; }
          git commit -m "Regenerate from content @ ${GITHUB_SHA::8}"
          git push
