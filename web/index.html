<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idlin</title>
    <link
      rel="preload"
      href="/fonts/JetBrainsMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/JetBrainsMono-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* JetBrains Mono (OFL, bundled): ONE face on every platform — the
         system mono stack only matches it on a Mac. Canvas-baked text
         (nameplates, damage numbers) uses the same family, so it must be
         preloaded before the scene starts baking labels. */
      @font-face {
        font-family: "Idlin Mono";
        font-weight: 400;
        font-display: block;
        src: url("/fonts/JetBrainsMono-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Idlin Mono";
        font-weight: 700;
        font-display: block;
        src: url("/fonts/JetBrainsMono-Bold.woff2") format("woff2");
      }
      /* The de-vibecoding pass (#181): a game face for titles and a book
         face for prose — mono retreats to NUMBERS. All OFL, bundled,
         font-display:block for byte-stable captures.
         Display = Cinzel (engraved Trajan-style capitals). */
      @font-face {
        font-family: "Idlin Display";
        font-weight: 600;
        font-display: block;
        src: url("/fonts/IdlinDisplay-SemiBold.woff2") format("woff2");
      }
      @font-face {
        font-family: "Idlin Display";
        font-weight: 700;
        font-display: block;
        src: url("/fonts/IdlinDisplay-Bold.woff2") format("woff2");
      }
      /* Text = Inter (a crisp UI sans — the serif was unreadable at HUD sizes). */
      @font-face {
        font-family: "Idlin Text";
        font-weight: 400;
        font-display: block;
        src: url("/fonts/IdlinText-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Idlin Text";
        font-weight: 600;
        font-display: block;
        src: url("/fonts/IdlinText-SemiBold.woff2") format("woff2");
      }
      @font-face {
        font-family: "Idlin Text";
        font-weight: 700;
        font-display: block;
        src: url("/fonts/IdlinText-Bold.woff2") format("woff2");
      }
      @font-face {
        font-family: "Idlin Text";
        font-weight: 400;
        font-style: italic;
        font-display: block;
        src: url("/fonts/IdlinText-Italic.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        font-family: "Idlin Text", system-ui, sans-serif;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
