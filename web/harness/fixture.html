<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idlin — harness fixture</title>
    <link
      rel="preload"
      href="/fonts/JetBrainsMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/JetBrainsMono-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Mirror index.html's base shell so the overlay lays out identically. */
      @font-face {
        font-family: "Idlin Mono";
        font-weight: 400;
        font-display: block;
        src: url("/fonts/JetBrainsMono-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Idlin Mono";
        font-weight: 700;
        font-display: block;
        src: url("/fonts/JetBrainsMono-Bold.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        font-family: "Idlin Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/harness/fixture.tsx"></script>
  </body>
</html>
