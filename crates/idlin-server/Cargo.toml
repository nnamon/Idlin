[package]
name = "idlin-server"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = "0.5"
futures-util = "0.3.32"
idlin-botc = { version = "1.0.0", path = "../idlin-botc" }
idlin-chat = { version = "1.0.0", path = "../idlin-chat" }
idlin-content = { version = "1.0.0", path = "../idlin-content" }
idlin-protocol = { version = "1.0.0", path = "../idlin-protocol" }
idlin-sim = { version = "1.0.0", path = "../idlin-sim" }
postcard = { version = "1.1.3", features = ["use-std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["fs", "trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
