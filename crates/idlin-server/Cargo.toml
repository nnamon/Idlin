[package]
name = "idlin-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
idlin-botc = { version = "0.1.0", path = "../idlin-botc" }
idlin-chat = { version = "0.1.0", path = "../idlin-chat" }
idlin-content = { version = "0.1.0", path = "../idlin-content" }
idlin-protocol = { version = "0.1.0", path = "../idlin-protocol" }
idlin-sim = { version = "0.1.0", path = "../idlin-sim" }
serde_json.workspace = true
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["fs", "trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
