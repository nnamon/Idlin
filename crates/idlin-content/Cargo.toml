[package]
name = "idlin-content"
version = "1.0.0"
edition = "2024"

[dependencies]
idlin-botc = { version = "1.0.0", path = "../idlin-botc" }
# #50 part 2: the `gen` tool emits content/lib/gen_abi.bot from idlin_vm::abi (the
# VM-ABI single owner), so the .bot side consumes the same strides/offsets the host
# does. Acyclic — idlin-vm is a leaf (already transitively present via idlin-botc).
idlin-vm = { version = "1.0.0", path = "../idlin-vm" }
ron = "0.12.1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
