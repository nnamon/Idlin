[package]
name = "idlin-sim"
version = "2.0.0"
edition = "2024"

[dependencies]
idlin-content = { version = "2.0.0", path = "../idlin-content" }
idlin-vm = { version = "2.0.0", path = "../idlin-vm" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
idlin-botc = { path = "../idlin-botc" }
postcard = { version = "1.1.3", features = ["alloc"] }
